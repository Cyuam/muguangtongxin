version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: muguang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: muguang
      POSTGRES_PASSWORD: muguang_dev_2026
      POSTGRES_DB: muguang
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muguang -d muguang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: muguang-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass muguang_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "muguang_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: muguang-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: muguang_minio
      MINIO_ROOT_PASSWORD: muguang_minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
